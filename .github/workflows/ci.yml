# Node 22 matches package.json "engines".
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typechecks src and, with tsconfig.test.json, the colocated *.test.ts files (the build's
      # tsc step skips tests).
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Every GLB under public/assets must stay within its triangle budget (ASSETS.md).
      - name: Check assets
        run: npm run check:assets

      # package.json build already typechecks, bundles, and runs scripts/check-prod-debug.mjs.
      - name: Build
        run: npm run build

  server-sim:
    name: server sim bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The committed bundle must equal a fresh build of src/sim-core, be ES5 and goja-safe, and
      # carry a version header equal to sha256 of its body.
      - name: Bundle is fresh and goja-safe
        run: npm run check:server-sim

      # A pull request that changes the bundle must change DUEL_SIM_VERSION too.
      - name: Version header follows bundle changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-server-bundle.mjs --base origin/${{ github.base_ref }}

      # The same golden logs in Chromium (the browser build's engine).
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Golden replays in Chromium
        run: npm run test:goldens-browser

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tools/goja-replay/go.sum

      # The same golden logs replay to the same results and hashes on goja, the engine of the hub's
      # Nakama TypeScript runtime (Node replays them in npm test, src/sim-core/bundle.test.ts).
      # Long boss fights take 10-20 s each on goja: see docs/SERVER-SIM.md "Performance".
      - name: Golden replays on goja
        run: npm run test:goja
